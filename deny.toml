# cargo-deny — 依存の許可制を機械が見る（ARC-013 / ADR 0002）。
#
# 🔴 検査の入口は `make deny`（`make check` に含まれる）。CI 側にだけ検査を書かない（QLT-005）。
# 🔴 ここを緩める変更は ADR を要する（QLT-010）。
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# 🔴 実際に使っているライセンスだけを書く。`make deny` は `--deny license-not-encountered` を
#    付けて走るので、使っていないライセンスをここに書くと落ちる。
#    現在の実測（Issue #18・`cargo deny list`・2026-10-23）:
#      LicenseRef-NeNe-Ledger-1.0 — 本リポジトリの全クレート（独自のライセンス・LICENSE・ADR 0009）
#      Apache-2.0 / MIT — encoding_rs 0.8.42 と、それが連れてくる cfg-if・core_detect・multiversion_no_op・
#                         rustversion・scopeguard・simdutf8（どれも Apache-2.0 OR MIT）
#      BSD-3-Clause — encoding_rs（WHATWG の表のデータ・`(Apache-2.0 OR MIT) AND BSD-3-Clause`）
#      （Issue #20 で x11rb 0.14.0・cairo-rs 0.22.9 とそれらが連れてくるもの。どれも Apache-2.0 か MIT を選べる）
#      Apache-2.0 WITH LLVM-exception — target-lexicon だけ（cairo-sys-rs の組み立て時の依存 system-deps → cfg-expr。
#                         配布物には入らない）
#      （Issue #55 で windows 0.62.2 と windows-numerics 0.3.1 とそれらが連れてくる windows-core・windows-implement・
#                         windows-interface・windows-link・windows-result・windows-strings・windows-collections・windows-future・
#                         windows-threading・proc-macro2・quote・syn。どれも Apache-2.0 か MIT を選べる。ADR 0016）
#      （GitHub Issue #171 で regex-automata 0.4.18 と、それが連れてくる regex-syntax 0.8.11。どちらも MIT OR Apache-2.0・ADR 0031）
#      Unicode-3.0 — unicode-ident だけ（syn が引く。windows-implement / windows-interface の手続きマクロの組み立て時の依存で、
#                         配布物には入らない・`(MIT OR Apache-2.0) AND Unicode-3.0`）
#    🔴 配布物にはこれらの著作権表示を添える。Windows の exe に入るクレートの一覧と本文は THIRD-PARTY-NOTICES.txt
#       （`make notices` で Cargo.lock から作り直し、`make notices-check` が食い違いを落とす・ADR 0032・GitHub Issue #181）。
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "LicenseRef-NeNe-Ledger-1.0",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# 同じクレートの複数版を許さない。単一バイナリで配る前提に対して、重複は「どちらが効いているか分からない」を持ち込む。
multiple-versions = "deny"
wildcards = "deny"
# 内部クレート（publish = false）の path 依存は版を持たないが、workspace の 1 つに解決するので
# 「どれが効いているか分からない」は起こらない。外部 crate の `*` は上の wildcards が今まで通り拒む。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
